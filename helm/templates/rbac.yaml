apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prompt-optimizer-role
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "prompt-optimizer.labels" . | nindent 4 }}
rules:
  # Allow patching the prompts ConfigMap (to update scenario_dialogue.txt)
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["prompts"]
    verbs: ["get", "patch"]
  # Allow restarting the inference deployment (rolling restart via annotation patch)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["lang-learn-inference-predictor"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prompt-optimizer-binding
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "prompt-optimizer.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: prompt-optimizer
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: prompt-optimizer-role
  apiGroup: rbac.authorization.k8s.io
