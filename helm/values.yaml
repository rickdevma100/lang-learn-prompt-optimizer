# -----------------------------------------------------------------------
# Prompt Optimizer Helm Values
# -----------------------------------------------------------------------

namespace: lang-learn

image:
  repository: rickdevma100/lang-learn-prompt-optimizer
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

# App-level configuration (passed as env vars)
config:
  appRoot: "/app"
  minScoreImprovement: "0.02"
  inferenceServiceUrl: "http://lang-learn-inference-predictor.lang-learn.svc.cluster.local/scenario_dialogue"
  logLevel: "INFO"
  mlflowTrackingUri: "http://mlflow-tracking.lang-learn.svc.cluster.local:5000"

# Email / SMTP settings
email:
  adminEmail: "rickdev.ma100@gmail.com"
  smtpHost: "smtp.gmail.com"
  smtpPort: "587"
  smtpUser: "rickdev.ma100@gmail.com"
  # SMTP password is loaded from a K8s Secret
  secretName: alertmanager-smtp-secret
  secretKey: smtp-password

# Persistent volume for prompts/ and metrics/
persistence:
  enabled: true
  storageClassName: microk8s-hostpath
  size: 1Gi
  accessMode: ReadWriteOnce

# Resource limits
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "250m"

# Health probes
probes:
  readiness:
    path: /healthz
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /healthz
    port: 8000
    initialDelaySeconds: 10
    periodSeconds: 30

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilization: 80
