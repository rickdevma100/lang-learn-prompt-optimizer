# -----------------------------------------------------------------------
# MLflow Tracking Server Helm Values
# -----------------------------------------------------------------------

namespace: lang-learn

# -----------------------------------------------------------------------
# PostgreSQL Backend Store
# -----------------------------------------------------------------------
postgres:
  image: postgres:16-alpine
  database: mlflow
  user: mlflow
  # Secret holding the PostgreSQL password
  secretName: mlflow-postgres-secret
  secretKey: postgres-password
  # Change this before deploying!
  defaultPassword: mlflow-postgres-pass

  persistence:
    storageClassName: microk8s-hostpath
    size: 5Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  probes:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 30

# -----------------------------------------------------------------------
# MLflow Tracking Server
# -----------------------------------------------------------------------
mlflow:
  image: python:3.12-slim
  version: "2.18.0"
  port: 5000
  artifactRoot: /mlflow-artifacts

  persistence:
    storageClassName: microk8s-hostpath
    size: 2Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1.5Gi"
      cpu: "500m"

  probes:
    readiness:
      path: /health
      initialDelaySeconds: 45
      periodSeconds: 10
    liveness:
      path: /health
      initialDelaySeconds: 60
      periodSeconds: 30
