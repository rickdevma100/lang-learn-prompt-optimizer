apiVersion: v1
kind: Service
metadata:
  name: mlflow-tracking
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    {{- include "mlflow.server.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mlflow.server.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.mlflow.port }}
      targetPort: {{ .Values.mlflow.port }}
      protocol: TCP
      name: http
