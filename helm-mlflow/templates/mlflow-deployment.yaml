apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-tracking
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    {{- include "mlflow.server.selectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mlflow.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mlflow.labels" . | nindent 8 }}
        {{- include "mlflow.server.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        # Install psycopg2-binary so MLflow can connect to PostgreSQL
        - name: install-pg-driver
          image: {{ .Values.mlflow.image }}
          command: ["pip", "install", "--target", "/shared-libs", "psycopg2-binary"]
          volumeMounts:
            - name: shared-libs
              mountPath: /shared-libs

      containers:
        - name: mlflow
          image: {{ .Values.mlflow.image }}
          ports:
            - containerPort: {{ .Values.mlflow.port }}
              protocol: TCP

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: {{ .Values.postgres.secretKey }}
            # Add shared libs to Python path so psycopg2 is available
            - name: PYTHONPATH
              value: /shared-libs

          command: ["mlflow"]
          args:
            - "server"
            - "--backend-store-uri"
            - "postgresql://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@mlflow-postgres:5432/{{ .Values.postgres.database }}"
            - "--default-artifact-root"
            - {{ .Values.mlflow.artifactRoot | quote }}
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.mlflow.port | quote }}

          resources:
            {{- toYaml .Values.mlflow.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: {{ .Values.mlflow.probes.readiness.path }}
              port: {{ .Values.mlflow.port }}
            initialDelaySeconds: {{ .Values.mlflow.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.mlflow.probes.readiness.periodSeconds }}

          livenessProbe:
            httpGet:
              path: {{ .Values.mlflow.probes.liveness.path }}
              port: {{ .Values.mlflow.port }}
            initialDelaySeconds: {{ .Values.mlflow.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.mlflow.probes.liveness.periodSeconds }}

          volumeMounts:
            - name: mlflow-artifacts
              mountPath: {{ .Values.mlflow.artifactRoot }}
            - name: shared-libs
              mountPath: /shared-libs

      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
        - name: shared-libs
          emptyDir: {}
