apiVersion: v1
kind: Service
metadata:
  name: mlflow-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    {{- include "mlflow.postgres.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mlflow.postgres.selectorLabels" . | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
